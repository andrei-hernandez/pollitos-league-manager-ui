<div class="container mx-auto p-4">
  <h1 class="text-3xl font-bold text-center mb-6">Player Management</h1>

  <div *ngIf="error" class="bg-red-100 text-red-700 p-4 rounded mb-4">
    {{ error }}
  </div>

  <div class="mb-6 flex justify-center">
    <label for="league" class="mr-2 font-semibold">Seleccionar Liga:</label>
    <select
      id="league"
      [(ngModel)]="selectedLeague"
      (change)="changeLeague(selectedLeague)"
      class="border border-gray-300 rounded p-2"
    >
      <option value="soccerleague">Soccer League</option>
      <option value="basketleague">Basket League</option>
    </select>
  </div>


  <div class="mb-6 flex justify-center" *ngIf="teams.length > 0">
    <label for="team" class="mr-2 font-semibold">Seleccionar Equipo:</label>
    <select
      id="team"
      [(ngModel)]="selectedTeam"
      (change)="loadPlayersByTeam(selectedTeam)"
      class="border border-gray-300 rounded p-2"
    >
      <option *ngFor="let team of teams" [ngValue]="team.name">
        {{ team.name }}
      </option>
    </select>
    <button
    (click) = "createNewPlayer()"
      class="bg-blue-500 text-white ml-5 px-4 py-2 rounded hover:bg-blue-600"
    >
      Create New Player
    </button>
  </div>

  <div class="overflow-x-auto mb-6" *ngIf="playersDTO.length > 0">
    <table class="table-auto w-full border-collapse border border-gray-200">
      <thead>
        <tr class="bg-gray-100 text-left">
          <th class="border border-gray-300 px-4 py-2">ID</th>
          <th class="border border-gray-300 px-4 py-2">Name</th>
          <th class="border border-gray-300 px-4 py-2">Team</th>
          <th class="border border-gray-300 px-4 py-2">League</th>
          <th class="border border-gray-300 px-4 py-2">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let player of playersDTO" class="hover:bg-gray-50">
          <td class="border border-gray-300 px-4 py-2">{{ player.id }}</td>
          <td class="border border-gray-300 px-4 py-2">{{ player.name }}</td>
          <td class="border border-gray-300 px-4 py-2">{{ selectedTeam }}</td>
          <td class="border border-gray-300 px-4 py-2">{{ selectedLeague }}</td>
          <td class="border border-gray-300 px-4 py-2">
            <button
              type="button"
              (click)="editPlayer(player)"
              class="bg-blue-500 text-white ml-3 px-4 py-2 rounded hover:bg-blue-600"
            >
              Edit
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="editingPlayer" class="bg-gray-100 p-6 rounded mb-6">
    <h2 class="text-2xl font-bold mb-4">Edit Player</h2>
    <form (ngSubmit)="saveEditing()">
      <div class="mb-4">
        <label for="playerName" class="block font-semibold mb-2"
          >Player Name</label
        >
        <input
          id="playerName"
          type="text"
          [(ngModel)]="editingPlayer.name"
          name="playerName"
          required
          class="w-full border border-gray-300 rounded p-2"
        />
      </div>

      <div class="mb-4">
        <label for="playerTeam" class="block font-semibold mb-2">Team</label>
        <select
          id="playerTeam"
          [(ngModel)]="editingPlayer.team"
          name="playerTeam"
          required
          class="w-full border border-gray-300 rounded p-2"
        >
          <option *ngFor="let team of teams" [ngValue]="team.name">
            {{ team.name }}
          </option>
        </select>
      </div>

      <div class="flex space-x-4">
        <button
          type="submit"
          class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600"
        >
          Update
        </button>
        <button
          type="button"
          class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600"
          (click)="cancelEditing()"
        >
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
