<div>
  <p-toast/>
  <br>
  <div class="space-x-5">
    <a [routerLink]="[leagueService.currentLeaguePath, 'createMatch']">
      <button type="button" class="focus:outline-none text-white bg-purple-700 hover:bg-purple-800 focus:ring-4 focus:ring-purple-300 font-medium rounded-lg text-sm px-5 py-2.5 mb-2 dark:bg-purple-600 dark:hover:bg-purple-700 dark:focus:ring-purple-900">
        Create
      </button>
    </a>
    <button type="button" class="focus:outline-none text-white bg-red-700 hover:bg-red-800 focus:ring-4 focus:ring-red-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-red-600 dark:hover:bg-red-700 dark:focus:ring-red-900"
    (click)="deleteAll()">
      Delete All
    </button>
  </div>
  <div class="card">
    <p-table [value]="teams" [tableStyle]="{ 'min-width': '40rem' }" >
      <ng-template #header>
        <tr>
          <th>ID</th>
          <th>Team name</th>
          <th>Matches</th>
        </tr>
      </ng-template>
      <ng-template #body let-team>
        <tr>
          <td>{{team.id}}</td>
          <td>{{team.name}}</td>
          <td>
            <!-- MATCHES TABLE -->
            <div class="card">
              <div class=" justify-center">
                <button type="button" (click)="showDialog(team.id)" class="focus:outline-none text-white bg-purple-700 hover:bg-purple-800 focus:ring-4 focus:ring-purple-300 font-medium rounded-lg text-sm px-5 py-2.5 mb-2 dark:bg-purple-600 dark:hover:bg-purple-700 dark:focus:ring-purple-900">
                  <i class="pi pi-external-link px-2"></i>Show</button>
              </div>
              <p-dialog
                header="Matches"
                [resizable]="false"
                [modal]="true"
                [maximizable]="true"
                appendTo="body"
                [(visible)]="dialogVisible"
                [style]="{ width: '75vw' }"
                [contentStyle]="{ height: '300px' }"
              >
                <p-table [value]="matches" [scrollable]="true" scrollHeight="flex" [tableStyle]="{ 'min-width': '50rem' }">
                  <ng-template #header>
                    <tr>
                      <th>Match ID</th>
                      <th>ID</th>
                      <th>Team A</th>
                      <th>Score Team A</th>
                      <th>ID</th>
                      <th>Team B</th>
                      <th>Score Team B</th>
                    </tr>
                  </ng-template>
                  <ng-template #body let-match>
                    <tr>
                      <td>{{ match.idMatch }}</td>
                      <td>{{ match.teamIdA }}</td>
                      <td>{{ match.teamNameA }}</td>
                      <td>{{ match.scoreTeamA }}</td>
                      <td>{{ match.teamIdB }}</td>
                      <td>{{ match.teamNameB }}</td>
                      <td>{{ match.scoreTeamB }}</td>
                    </tr>
                  </ng-template>
                </p-table>
                <ng-template #footer>
                  <p-button label="Ok" icon="pi pi-check" (onClick)="dialogVisible = false" />
                </ng-template>
              </p-dialog>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
