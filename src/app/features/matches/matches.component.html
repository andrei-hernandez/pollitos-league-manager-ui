<div class="container">
  <h1>Gestión de Partidos</h1>

  <button mat-raised-button color="primary" routerLink="" class="mb-3">Ir a Inicio</button>
  <button mat-raised-button color="primary" (click)="navigateToCreate()">Crear Partido</button>

  <div class="search mb-3">
    <mat-form-field appearance="fill" class="d-inline-block">
      <mat-label>Buscar por ID del equipo</mat-label>
      <input
        matInput
        type="number"
        placeholder="Buscar por ID del equipo"
        [(ngModel)]="searchTeamId"
        class="form-control search-input"
      />
    </mat-form-field>
    <button mat-raised-button color="accent" (click)="searchMatches(searchTeamId)" class="ml-2">Buscar</button>
  </div>

  <table mat-table [dataSource]="matches" class="mat-elevation-z8">
    <ng-container matColumnDef="idmatch">
      <th mat-header-cell *matHeaderCellDef> ID Partido </th>
      <td mat-cell *matCellDef="let match"> {{ match.idmatch }} </td>
    </ng-container>

    <ng-container matColumnDef="idleague">
      <th mat-header-cell *matHeaderCellDef> ID Liga </th>
      <td mat-cell *matCellDef="let match"> {{ match.idleague }} </td>
    </ng-container>

    <ng-container matColumnDef="localteamid">
      <th mat-header-cell *matHeaderCellDef> Equipo Local </th>
      <td mat-cell *matCellDef="let match"> {{ match.localteamid }} </td>
    </ng-container>

    <ng-container matColumnDef="visitteamid">
      <th mat-header-cell *matHeaderCellDef> Equipo Visitante </th>
      <td mat-cell *matCellDef="let match"> {{ match.visitteamid }} </td>
    </ng-container>

    <ng-container matColumnDef="goallocal">
      <th mat-header-cell *matHeaderCellDef> Goles Local </th>
      <td mat-cell *matCellDef="let match"> {{ match.goallocal }} </td>
    </ng-container>

    <ng-container matColumnDef="goalVisit">
      <th mat-header-cell *matHeaderCellDef> Goles Visitante </th>
      <td mat-cell *matCellDef="let match"> {{ match.goalVisit }} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let match">
        <button mat-icon-button color="warn" (click)="deleteMatch(match.idmatch)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
