<div class="container mx-auto p-4">
  <h1 class="text-3xl font-bold text-center mb-6">Matches Management</h1>

  <!-- liga -->
  <div class="mb-6 flex justify-center">
    <label for="league" class="mr-2 font-semibold">Select League:</label>
    <select
      id="league"
      [(ngModel)]="selectedLeague"
      (change)="changeLeague(selectedLeague)"
      class="border border-gray-300 rounded p-2"
    >
      <option value="soccerleague">Soccer League</option>
      <option value="basketleague">Basket League</option>
    </select>
  </div>

  <div class="bg-gray-100 p-6 rounded mb-6">
    <h2 class="text-2xl font-bold mb-4">Create Team</h2>
    <form (ngSubmit)="createMatch()" class="space-y-4">
      <div>
        <label for="team1" class="block font-semibold mb-1">Team 1:</label>
        <select
          id="team1"
          [(ngModel)]="newMatch.teamDTO1"
          name="team1"
          required
          class="w-full border border-gray-300 rounded p-2"
        >
          <option *ngFor="let team of filteredTeams" [ngValue]="team">
            {{ team.name }}
          </option>
        </select>
      </div>

      <div>
        <label for="team2" class="block font-semibold mb-1">Team 2:</label>
        <select
          id="team2"
          [(ngModel)]="newMatch.teamDTO2"
          name="team2"
          required
          class="w-full border border-gray-300 rounded p-2"
        >
          <option *ngFor="let team of filteredTeams" [ngValue]="team">
            {{ team.name }}
          </option>
        </select>
      </div>

      <div class="flex space-x-4">
        <input
          type="number"
          [(ngModel)]="newMatch.scoreTeam1"
          name="team1Score"
          placeholder="Puntaje Equipo 1"
          required
          class="border border-gray-300 rounded p-2 flex-1"
        />
        <input
          type="number"
          [(ngModel)]="newMatch.scoreTeam2"
          name="team2Score"
          placeholder="Puntaje Equipo 2"
          required
          class="border border-gray-300 rounded p-2 flex-1"
        />
      </div>
      <button
        type="submit"
        class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600"
      >
        Create Match
      </button>

      <button
        type="button"
        (click)="loadMatches()"
        class="bg-blue-500 text-white ml-3 px-4 py-2 rounded hover:bg-blue-600"
      >
        See Matches
      </button>

      <button
        type="button"
        (click)="deleteMatches(selectedLeague)"
        class="bg-red-500 text-white ml-3 px-4 py-2 rounded hover:bg-red-600"
      >
        Delete Matches
      </button>
    </form>
  </div>

  <div *ngIf="showMatches" class="bg-gray-100 p-6 rounded mb-6">
    <h2 class="text-2xl font-bold mb-4">Matches</h2>
    <div class="overflow-x-auto mb-6">
      <table class="table-auto w-full border-collapse border border-gray-200">
        <thead>
          <tr class="bg-gray-100 text-left">
            <th class="border border-gray-300 px-4 py-2">Team 1</th>
            <th class="border border-gray-300 px-4 py-2">Team 2</th>
            <th class="border border-gray-300 px-4 py-2">League</th>
            <th class="border border-gray-300 px-4 py-2">Score</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let match of filteredMatches" class="hover:bg-gray-50">
            <td class="border border-gray-300 px-4 py-2">
              {{ match.teamDTO1.name }}
            </td>
            <td class="border border-gray-300 px-4 py-2">
              {{ match.teamDTO2.name }}
            </td>
            <td class="border border-gray-300 px-4 py-2">
              {{ selectedLeague }}
            </td>
            <td class="border border-gray-300 px-4 py-2">
              {{ match.scoreTeam1 }} - {{ match.scoreTeam2 }}
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
