<div class="container">
  <h2>Lista de Jugadores</h2>

  <button mat-raised-button color="primary" routerLink="" class="mb-3">Ir a Inicio</button>

  <div class="mb-3">
    <label for="playerId">Mostrar Jugadores por Equipo</label>
    <input
      type="number"
      id="playerId"
      class="form-control"
      [(ngModel)]="searchPlayerId"
      placeholder="Ingrese el ID del jugador"
    />
    <button mat-raised-button color="primary" class="mt-2" (click)="searchPlayer(searchPlayerId)">Buscar</button>
  </div>

  <div class="mb-3">
    <button mat-raised-button color="accent" class="mt-2" [routerLink]="['/createPlayer']">Crear Jugador</button>
  </div>

  <table mat-table [dataSource]="filteredPlayers" class="mat-elevation-z8">
    <ng-container matColumnDef="idPlayer">
      <th mat-header-cell *matHeaderCellDef> ID Jugador </th>
      <td mat-cell *matCellDef="let player"> {{ player.idPlayer }} </td>
    </ng-container>

    <ng-container matColumnDef="namePlayer">
      <th mat-header-cell *matHeaderCellDef> Nombre </th>
      <td mat-cell *matCellDef="let player"> {{ player.namePlayer }} </td>
    </ng-container>

    <ng-container matColumnDef="idLeague">
      <th mat-header-cell *matHeaderCellDef> ID Liga </th>
      <td mat-cell *matCellDef="let player"> {{ player.idLeague }} </td>
    </ng-container>

    <ng-container matColumnDef="idTeam">
      <th mat-header-cell *matHeaderCellDef> ID Equipo </th>
      <td mat-cell *matCellDef="let player"> {{ player.idTeam }} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let player">
        <button mat-icon-button color="accent">
          <mat-icon>edit</mat-icon>
          <a [routerLink]="['/editPlayer', player.idPlayer]" class="mat-button">Editar</a>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
