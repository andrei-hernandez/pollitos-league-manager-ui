<div>
  <p-toast />
  <br>
  <a [routerLink]="[leagueService.currentLeaguePath, 'createTeam']">
  <button type="button" class="focus:outline-none text-white bg-purple-700 hover:bg-purple-800 focus:ring-4 focus:ring-purple-300 font-medium rounded-lg text-sm px-5 py-2.5 mb-2 dark:bg-purple-600 dark:hover:bg-purple-700 dark:focus:ring-purple-900">
    Create
  </button>
  </a>
  <div class="card">
    <p-table [value]="teams" [tableStyle]="{ 'min-width': '40rem' }" >
      <ng-template #header>
        <tr>
          <th>ID</th>
          <th>Team name</th>
          <th>Edit Team</th>
          <th>Delete Players</th>
        </tr>
      </ng-template>
      <ng-template #body let-team>
        <tr>
          <td>{{team.id}}</td>
          <td>{{team.name}}</td>
          <td>
            <a [routerLink]="['/editTeam',team.id]">
              <button><i class="pi pi-pen-to-square text-blue-500"></i></button>
            </a>
          </td>
          <td>
            <button type="button" (click)="deletePlayers(team.id)">
              <i class="pi pi-trash text-red-500"></i>
            </button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
