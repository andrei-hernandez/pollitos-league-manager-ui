<div>

  <div class="text-5xl font-extrabold grid place-items-center h-80 leading-normal">
  <span class="bg-clip-text text-transparent bg-gradient-to-r from-pink-500 to-violet-500">
    Welcome to {{ leagueService.currentLeagueName }} league
  </span>
  </div>
  <br>
  <div class="w-fit flex mx-auto">
    <button (click)="toggleLeague()" type="button" class="py-2.5 px-5 me-2 mb-2 text-sm font-medium text-gray-900 focus:outline-none bg-white rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700">
      Switch to {{ leagueService.nextLeagueName }} league
    </button>
  </div>
</div>
